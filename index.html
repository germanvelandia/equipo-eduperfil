<style id="css">
/* Layout: una sola columna de lectura; franja de identidad arriba, luego integrantes, matriz de fortalezas, roles y declaración. */
:root{
  --bg:#f6f3ea; --surface:#fffdf8; --surface-2:#eef1e8; --ink:#1b2a24; --muted:#4c5c54; --line:#d8d5c6;
  --forest:#1f4a3a; --on-forest:#f6f3ea; --forest-ink:#1f4a3a;

  --petrol:#1d5c66; --on-petrol:#f3f6f2; --petrol-ink:#1b5660; --petrol-soft:#dde9ea;
  --gold:#b48c3a; --gold-ink:#7f611f; --gold-soft:#f1e7cf;
  --danger:#9a3324;
  --f-display:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a16; --surface:#16231e; --surface-2:#1b2b25; --ink:#ecefe6; --muted:#aab6ad; --line:#2c3d36;

  --petrol:#2a6c77; --on-petrol:#f1f5f2; --petrol-ink:#93cbd3; --petrol-soft:#18313a;
  --gold:#c9a457; --gold-ink:#dcbb74; --gold-soft:#2e2a1c; --danger:#e08a7a; color-scheme:dark}}
:root[data-theme="dark"]{

  --forest:#2c5d49; --on-forest:#f3f0e6; --forest-ink:#9fd0b5; --sage:#6f8d72; --sage-soft:#1f3129;
  --petrol:#2a6c77; --on-petrol:#f1f5f2; --petrol-ink:#93cbd3; --petrol-soft:#18313a;
  --gold:#c9a457; --gold-ink:#dcbb74; --gold-soft:#2e2a1c; --danger:#e08a7a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}

button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.hero{background:var(--forest);color:var(--on-forest)}

.stats{display:flex;gap:26px}
.stat{display:flex;flex-direction:column}

main.wrap{padding-block:36px 56px;display:flex;flex-direction:column;gap:48px}
section{display:flex;flex-direction:column;gap:18px;scroll-margin-top:16px}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}

.btn:hover{filter:brightness(1.08)}

.btn.ghost:hover{background:var(--sage-soft)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn svg{width:16px;height:16px;flex:none}
.edit-only{display:none}
.can-edit .edit-only{display:inline-flex}

.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.member{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.member header{display:flex;gap:14px;align-items:center}
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:1.1rem;color:var(--on-forest);flex:none}
.member h3{font-size:1.08rem}
.member .form{font-size:.88rem;color:var(--muted);line-height:1.4}
.role{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--gold-soft);color:var(--gold-ink)}
.role.none{background:var(--surface-2);color:var(--muted);font-weight:400;font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;padding:3px 10px;border-radius:99px;background:var(--sage-soft);color:var(--forest-ink)}
.member footer{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:6px}
.tool{font-size:.78rem;color:var(--muted)}

.addcard:hover{background:var(--sage-soft)}
.addcard svg{width:28px;height:28px}

.matrix-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
thead th{font-family:var(--f-display);font-weight:500;font-size:.82rem;color:var(--muted);background:var(--surface-2)}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
.matrix td.c{text-align:center;width:1%}
.matrix th.c{text-align:center;white-space:nowrap}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--forest)}
:root[data-theme="dark"] .dot{background:var(--forest-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dot{background:var(--forest-ink)}}
.kind{font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.kind.shared{background:var(--petrol-soft);color:var(--petrol-ink)}
.kind.unique{background:var(--gold-soft);color:var(--gold-ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}

.decl{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:28px}
.decl .q{font-family:var(--f-display);font-weight:500;color:var(--forest-ink);font-size:1.05rem}
.decl .text{font-size:1.05rem;white-space:pre-line;margin-top:12px;max-width:68ch}
.decl .empty{color:var(--muted);font-style:italic;margin-top:12px}
.meter{display:flex;flex-direction:column;gap:6px}
.meter b{font-family:var(--f-display);font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.meter .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter .bar span{display:block;height:100%;background:var(--forest)}
.meter .bar span.over{background:var(--danger)}
.meter small{color:var(--muted);font-size:.82rem}

.how{background:var(--surface-2);border-radius:16px;padding:22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.how div{display:flex;flex-direction:column;gap:6px}
.how b{font-family:var(--f-display);font-weight:500;color:var(--forest-ink)}
.how span{font-size:.92rem;color:var(--muted)}
.how .n{font-family:var(--f-display);font-size:.78rem;color:var(--petrol-ink);font-weight:600}

dialog{border:0;border-radius:20px;padding:0;width:100%;max-width:min(600px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(10,25,20,.55)}
dialog form{padding:24px;display:flex;flex-direction:column;gap:14px;max-height:min(84vh,760px);overflow-y:auto}
dialog h3{font-size:1.25rem;color:var(--forest-ink)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:700;font-size:.9rem}
.field small{color:var(--muted);font-size:.8rem}
.field input,.field textarea{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);width:100%}
.field textarea{min-height:140px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--forest-ink);outline:none}
.row{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.row .right{display:flex;gap:8px;margin-left:auto}
.err{color:var(--danger);font-size:.85rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.9rem;z-index:60;max-width:calc(100vw - 32px)}
.status{font-size:.85rem;color:var(--muted)}

@media (max-width:760px){
  .hero .wrap{grid-template-columns:1fr}
  .decl{grid-template-columns:1fr}
  .how{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script id="app">
(function(){
const SKELETON='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';

document.documentElement.lang="es";

let state; try{ state=JSON.parse(document.getElementById("state").textContent) }catch(e){ state={equipo:{nombre:"",lema:"",declaracion:""},integrantes:[]} }
state.equipo=state.equipo||{nombre:"",lema:"",declaracion:""}; state.integrantes=state.integrantes||[];
let artifactNs=null, canEdit=false, saving=false;

const P={edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',ext:'<path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>',plus:'<path d="M12 5v14M5 12h14"/>'};

function strengths(){
  const map=new Map();
  state.integrantes.forEach((m,i)=>(m.fortalezas||[]).forEach(f=>{

    </div>
  </div></header>
  <main class="wrap">

      <div class="shead"><div><span class="eyebrow">Integrantes</span><h2 id="h-int">Quiénes conforman el equipo</h2></div></div>

          <span class="role ${m.rol?"":"none"}">${m.rol?esc(m.rol):"Rol por definir"}</span>
          ${(m.fortalezas||[]).length?`<div class="chips" aria-label="Fortalezas">${m.fortalezas.map(f=>`<span class="chip">${esc(f)}</span>`).join("")}</div>`:""}
          <footer>
            ${safeUrl(m.enlace)?`<a class="btn" href="${esc(m.enlace)}" target="_blank" rel="noopener">Ver EduPerfil ${ic("ext")}</a>`:`<span class="nolink">Enlace al EduPerfil pendiente</span>`}

            ${m.herramienta?`<span class="tool">Hecho en ${esc(m.herramienta)}</span>`:""}
          </footer>
        </article>`).join("")}
        ${canEdit?`<button class="addcard" type="button" data-act="add">${ic("plus")}<span>Agregar integrante</span></button>`:""}

      ${st.length&&ms.length?`

        <thead><tr><th scope="col">Fortaleza</th>${ms.map((m,i)=>`<th scope="col" class="c" title="${esc(m.nombre)}">${esc(initials(m.nombre))}</th>`).join("")}<th scope="col">Tipo</th></tr></thead>
        <tbody>${st.map(s=>`<tr><th scope="row" style="font-weight:400">${esc(s.label)}</th>${ms.map((m,i)=>`<td class="c">${s.who.has(i)?`<span class="dot" role="img" aria-label="${esc(m.nombre)} la aporta"></span>`:`<span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">No</span>`}</td>`).join("")}
          <td>${s.who.size>1?`<span class="kind shared">Compartida · ${s.who.size}</span>`:`<span class="kind unique">Aporte único</span>`}</td></tr>`).join("")}</tbody>
      </table></div>
      <div class="legend">${ms.map((m,i)=>`<span><b>${esc(initials(m.nombre))}</b> = ${esc(m.nombre)}</span>`).join("")}</div>`
      :`<p class="nolink">Aparecerán aquí cuando los integrantes registren sus fortalezas.</p>`}
    </section>

    <section id="roles" aria-labelledby="h-rol">
      <div class="shead"><div><span class="eyebrow">Organización</span><h2 id="h-rol">Posibles roles</h2></div></div>
      <div class="matrix-wrap"><table>
        <thead><tr><th scope="col">Integrante</th><th scope="col">Rol posible</th><th scope="col">Fortaleza que lo sustenta</th></tr></thead>
        <tbody>${ms.map(m=>`<tr><td>${esc(m.nombre)}</td><td>${m.rol?esc(m.rol):'<span class="status">Por definir con el equipo</span>'}</td><td>${(m.fortalezas||[])[0]?esc(m.fortalezas[0]):"—"}</td></tr>`).join("")||`<tr><td colspan="3" class="status">Sin integrantes registrados</td></tr>`}</tbody>
      </table></div>
    </section>

    <section id="declaracion" aria-labelledby="h-dec">
      <div class="shead"><div><span class="eyebrow">Postulación</span><h2 id="h-dec">Declaración del equipo</h2></div>
        <button class="btn ghost edit-only" type="button" data-act="team">${ic("edit")}Editar declaración</button></div>
      <div class="decl">
        <div><p class="q">¿Por qué este equipo está preparado para asumir un reto educativo relacionado con inclusión, interculturalidad y tecnología?</p>
          ${e.declaracion?`<p class="text">${esc(e.declaracion)}</p>`:`<p class="empty">El equipo escribirá aquí su declaración después de revisar los EduPerfiles de todos.</p>`}</div>
        <div class="meter" aria-label="Extensión de la declaración">
          <b>${w}</b><small>de 150 palabras como máximo</small>
          <div class="bar"><span class="${w>150?"over":""}" style="width:${Math.min(100,w/150*100)}%"></span></div>
          ${w>150?`<small style="color:var(--danger)">Sobran ${w-150} palabras</small>`:""}
        </div>
      </div>
    </section>

    <section aria-labelledby="h-how">
      <div class="shead"><div><span class="eyebrow">Para los integrantes</span><h2 id="h-how">Cómo sumar tu EduPerfil</h2></div></div>
      <div class="how">
        <div><span class="n">Paso 1</span><b>Publica tu EduPerfil</b><span>En Genially, Canva, GitHub Pages u otra herramienta, con acceso público.</span></div>
        <div><span class="n">Paso 2</span><b>Comparte tus datos</b><span>Envía al editor de esta ficha tu nombre, formación, rol posible, fortalezas y enlace.</span></div>
        <div><span class="n">Paso 3</span><b>Verifica el acceso</b><span>Abre tu tarjeta desde una ventana privada del navegador y confirma que carga sin iniciar sesión.</span></div>
      </div>
      <p class="status" id="editHint"></p>
    </section>
  </main>`;
  const hint=document.getElementById("editHint");
  if(hint) hint.textContent = canEdit ? "Tienes permiso de edición: los cambios que guardes se publican para todos." : "";
}

/* ---------- Edición ---------- */
const dlg=document.createElement("dialog"); dlg.setAttribute("aria-labelledby","dlgT"); document.body.appendChild(dlg);
function fortalezaOptions(){ return strengths().map(s=>`<option value="${esc(s.label)}"></option>`).join("") }
function openMember(i){
  const m = i==null ? {id:"m"+Date.now().toString(36),nombre:"",formacion:"",rol:"",fortalezas:[],enlace:"",herramienta:""} : state.integrantes[i];
  dlg.innerHTML=`<form method="dialog" id="fm" novalidate>
    <h3 id="dlgT">${i==null?"Agregar integrante":"Editar integrante"}</h3>
    <div class="field"><label for="f-nombre">Nombre completo</label><input id="f-nombre" required value="${esc(m.nombre)}"></div>
    <div class="field"><label for="f-form">Formación y cargo</label><input id="f-form" value="${esc(m.formacion)}" placeholder="Ej.: Licenciada en Lenguas · Docente de primaria"></div>
    <div class="field"><label for="f-rol">Rol posible en el equipo</label><input id="f-rol" value="${esc(m.rol)}" placeholder="Ej.: Coordinación pedagógica"></div>
    <div class="field"><label for="f-fort">Fortalezas</label><input id="f-fort" list="dl-fort" value="${esc((m.fortalezas||[]).join(", "))}"><small>Sepáralas con comas. Usar los mismos nombres que tus compañeros permite ver las fortalezas compartidas.</small><datalist id="dl-fort">${fortalezaOptions()}</datalist></div>
    <div class="field"><label for="f-url">Enlace al EduPerfil</label><input id="f-url" type="url" inputmode="url" value="${esc(m.enlace)}" placeholder="https://"></div>
    <div class="field"><label for="f-tool">Herramienta usada</label><input id="f-tool" value="${esc(m.herramienta)}" placeholder="Ej.: Genially"></div>
    <p class="err" id="ferr" hidden></p>
    <div class="row">
      ${i==null?"":`<button class="btn danger" type="button" id="delBtn">Quitar integrante</button>`}
      <div class="right"><button class="btn ghost" type="button" value="cancel" id="cancelBtn">Cancelar</button><button class="btn" type="submit">Guardar y publicar</button></div>
    </div></form>`;
  dlg.showModal();
  dlg.querySelector("#cancelBtn").onclick=()=>dlg.close();
  const del=dlg.querySelector("#delBtn");
  if(del){ let armed=false; del.onclick=()=>{ if(!armed){armed=true;del.textContent="Confirmar: quitar";return;} const next=clone(); next.integrantes.splice(i,1); save(next); }; }
  dlg.querySelector("#fm").onsubmit=ev=>{
    ev.preventDefault();
    const v=id=>dlg.querySelector(id).value.trim();
    const err=dlg.querySelector("#ferr");
    if(!v("#f-nombre")){ err.textContent="Escribe el nombre del integrante."; err.hidden=false; dlg.querySelector("#f-nombre").focus(); return; }
    const url=v("#f-url");
    if(url && !safeUrl(url)){ err.textContent="El enlace debe empezar por https:// (cópialo completo desde el navegador)."; err.hidden=false; dlg.querySelector("#f-url").focus(); return; }
    const item={id:m.id,nombre:v("#f-nombre"),formacion:v("#f-form"),rol:v("#f-rol"),fortalezas:v("#f-fort").split(",").map(s=>s.trim()).filter(Boolean),enlace:url,herramienta:v("#f-tool")};
    const next=clone(); if(i==null) next.integrantes.push(item); else next.integrantes[i]=item;
    save(next);
  };
  dlg.querySelector("#f-nombre").focus();
}
function openTeam(){
  const e=state.equipo;
  dlg.innerHTML=`<form method="dialog" id="ft" novalidate>
    <h3 id="dlgT">Datos del equipo</h3>
    <div class="field"><label for="t-nombre">Nombre del equipo</label><input id="t-nombre" value="${esc(e.nombre)}"></div>
    <div class="field"><label for="t-lema">Frase de identidad</label><input id="t-lema" value="${esc(e.lema)}" placeholder="Una línea que represente al equipo"></div>
    <div class="field"><label for="t-dec">Declaración de postulación</label><textarea id="t-dec">${esc(e.declaracion)}</textarea><small id="t-count"></small></div>
    <div class="row"><div class="right"><button class="btn ghost" type="button" id="cancelBtn">Cancelar</button><button class="btn" type="submit">Guardar y publicar</button></div></div>
  </form>`;
  dlg.showModal();
  const ta=dlg.querySelector("#t-dec"), cnt=dlg.querySelector("#t-count");
  const upd=()=>{const n=words(ta.value); cnt.textContent=`${n} de 150 palabras`; cnt.style.color=n>150?"var(--danger)":"";};
  ta.oninput=upd; upd();
  dlg.querySelector("#cancelBtn").onclick=()=>dlg.close();
  dlg.querySelector("#ft").onsubmit=ev=>{ ev.preventDefault();
    const next=clone(); next.equipo={nombre:dlg.querySelector("#t-nombre").value.trim(),lema:dlg.querySelector("#t-lema").value.trim(),declaracion:ta.value.trim()};
    save(next); };
  dlg.querySelector("#t-nombre").focus();
}
const clone=()=>JSON.parse(JSON.stringify(state));

function buildDocument(next){
  const css=document.getElementById("css").textContent;
  const app=document.getElementById("app").textContent;
  const json=JSON.stringify(next).replace(/</g,"\\u003c");
  return SKELETON+HEAD_EXTRA+'<style id="css">'+css+'</style>\n<div id="root"></div>\n<script type="application/json" id="state">'+json+'<\/script>\n<script id="app">'+app+'<\/script></body></html>';
}
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),4200); }
async function save(next){
  if(saving||!artifactNs) return; saving=true;
  const btn=dlg.querySelector('button[type="submit"]'); if(btn){btn.disabled=true;btn.textContent="Publicando…";}
  try{ await artifactNs.publish(buildDocument(next)); state=next; dlg.close(); render(); toast("Cambios publicados"); }
  catch(e){
    const code=e&&e.code;
    if(code==="conflict"){ dlg.close(); toast("Otra persona guardó al mismo tiempo. La página se actualizará; vuelve a hacer tu cambio."); }
    else if(code==="not_granted"||code==="not_writer"){ canEdit=false; dlg.close(); render(); toast("No tienes permiso para editar esta ficha."); }
    else { const err=dlg.querySelector(".err"); if(err){err.textContent="No se pudo publicar. Revisa tu conexión e inténtalo de nuevo."; err.hidden=false;} if(btn){btn.disabled=false;btn.textContent="Guardar y publicar";} }
  } finally { saving=false; }
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]"); if(!b||!canEdit) return;
  const a=b.dataset.act;
  if(a==="add") openMember(null); else if(a==="edit") openMember(+b.dataset.i); else if(a==="team") openTeam();
});
dlg.addEventListener("click",ev=>{ if(ev.target===dlg) dlg.close(); });

render();
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [art,user]=await Promise.all([window.claude.use("artifact"),window.claude.use("user")]);
    if(!art) return;
    artifactNs=art;
    canEdit = user ? !!(await user.canEdit()) : false;
    if(canEdit) render();
  }catch(e){}
})();
})();
</script>

</body></html>
